<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBHCLI Web</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css?v=5.3.1.4" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css?v=5.3.1.4" />
</head>
<body>
  <div id="app">
    <!-- ===== 工作区面板（v5.2.8：新会话 + 工作区会话列表 + 设置按钮；
         与文件管理器面板可左右互换，宽度可拖拽） ===== -->
    <aside id="ws-panel" class="side-panel">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">❯</span>
          <span class="logo-text">CBHCLI</span>
          <span class="logo-version" id="app-version"></span>
        </div>
      </div>
      <button class="side-new-session" id="btn-new-session-side" title="新建会话 (/new)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>新会话</span>
      </button>
      <input class="ws-filter hidden" id="ws-filter" placeholder="搜索会话…" />
      <div class="ws-header">
        <span class="ws-title">工作区</span>
        <span class="ws-actions">
          <button class="ws-icon-btn" id="btn-ws-search" title="搜索会话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
          <button class="ws-icon-btn" id="btn-ws-refresh" title="刷新会话列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="ws-icon-btn" id="btn-ws-open" title="打开文件夹作为工作空间">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6M9 13h6"/></svg>
          </button>
          <button class="ws-icon-btn" id="btn-ws-swap" title="工作区/文件管理器左右互换">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          </button>
        </span>
      </div>
      <div class="ws-list" id="ws-list"></div>
      <div class="sidebar-footer">
        <button class="side-settings-btn" id="btn-settings" title="设置（Agent/模型/技能/MCP/安全等）">
          <span class="nav-icon">⚙️</span><span class="nav-label">设置</span>
        </button>
      </div>
    </aside>

    <!-- ===== 文件管理器面板 ===== -->
    <aside id="fm-panel" class="side-panel">
      <div class="fm-header">
        <span class="fm-title">📁 文件</span>
        <span class="ws-actions">
          <button class="ws-icon-btn" id="btn-fm-up" title="上级目录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
          <button class="ws-icon-btn" id="btn-fm-refresh" title="刷新文件列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="ws-icon-btn" id="btn-fm-swap" title="文件管理器/工作区左右互换">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
          </button>
        </span>
      </div>
      <div class="fm-crumb" id="fm-crumb"></div>
      <div class="fm-list" id="fm-list"></div>
    </aside>

    <div class="resize-handle" id="resize-left" title="拖动调整面板宽度"></div>

    <!-- ===== 主区域 ===== -->
    <main id="main">
      <!-- 对话视图 -->
      <section class="view active" id="view-chat">
        <header class="chat-header">
          <div class="chat-selectors">
            <select id="chat-agent-select" class="select"></select>
            <select id="chat-model-select" class="select"></select>
          </div>
          <div class="chat-header-right">
            <button class="btn btn-ghost" id="btn-chain" title="Agent 链条">🔗</button>
            <div class="mode-badge" id="mode-badge" title="权限模式（点击切换）">
              <span id="mode-badge-text">🟢 标准</span>
            </div>
            <div class="ctx-meter" id="ctx-meter" title="上下文使用情况">
              <div class="ctx-meter-bar"><div class="ctx-meter-fill" id="ctx-meter-fill"></div></div>
              <span class="ctx-meter-text" id="ctx-meter-text">0%</span>
            </div>
            <button class="btn btn-ghost" id="btn-quick-tools" title="快捷配置：工具开关">🔧</button>
            <button class="btn btn-ghost" id="btn-quick-skills" title="快捷配置：技能管理">⚡</button>
            <button class="btn btn-ghost" id="btn-quick-model" title="快捷配置：切换模型">🧠</button>
            <button class="btn btn-ghost" id="btn-undo" title="回滚文件修改 (/undo)">↩️</button>
            <button class="btn btn-ghost" id="btn-compress" title="手动压缩上下文 (/comp)">📦</button>
            <button class="btn btn-ghost" id="btn-new-session" title="新建会话 (/new)">✚ 新会话</button>
          </div>
        </header>

        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty" id="chat-empty">
            <div class="chat-empty-icon">❯</div>
            <h2>CBHCLI Web</h2>
            <p>AI 驱动的终端助手 · 支持工具调用、知识库、技能系统</p>
          </div>
        </div>

        <div class="chat-composer">
          <div class="attachments" id="attachments"></div>
          <div class="composer-box">
            <button class="btn btn-icon" id="btn-attach" title="上传文件/图片">
              <svg class="icon-paperclip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <textarea id="chat-input" placeholder="输入消息… (Enter 发送，Shift+Enter / Alt+Enter 换行)" rows="1"></textarea>
            <button class="btn btn-icon btn-send" id="btn-send" title="发送">➤</button>
            <button class="btn btn-icon btn-abort hidden" id="btn-abort" title="中断">■</button>
          </div>
          <div class="composer-footer">
            <div class="cwd-bar" id="cwd-bar" title="">
              <svg class="icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
              <span class="cwd-bar-text" id="cwd-bar-text"></span>
            </div>
            <div class="composer-hint" id="composer-hint"></div>
          </div>
          <input type="file" id="file-input" multiple hidden />
        </div>
      </section>

      <!-- 其他视图容器 -->
      <section class="view" id="view-agents"></section>
      <section class="view" id="view-chains"></section>
      <section class="view" id="view-models"></section>
      <section class="view" id="view-fallback"></section>
      <section class="view" id="view-skills"></section>
      <section class="view" id="view-mcp"></section>
      <section class="view" id="view-knowledge"></section>
      <section class="view" id="view-tools"></section>
      <section class="view" id="view-security"></section>
      <section class="view" id="view-embedding"></section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-settings"></section>
    </main>

    <div class="resize-handle" id="resize-right" title="拖动调整面板宽度"></div>
  </div>

  <!-- 模态框 -->
  <div id="modal-root"></div>
  <!-- Toast 通知 -->
  <div id="toast-root"></div>

  <script src="/vendor/marked.umd.js?v=5.3.1.4"></script>
  <script src="/vendor/katex/katex.min.js?v=5.3.1.4"></script>
  <script src="/js/app.js?v=5.3.1.4"></script>
</body>
</html>
