[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cbhcli"
version = "4.7.1"
authors = [
    {name = "陈丙寰", email = "13943034070@163.com"},
]
description = "AI驱动的终端助手 - 支持多Agent管理、工具调用和会话管理"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "wcwidth>=0.2.5",
    "prompt_toolkit>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "chromadb>=0.4.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.scripts]
cbhcli = "cbhcli_pkg.cli:main"

[project.urls]
"Homepage" = "https://github.com/chenbh17/cbhcli"
"Bug Reports" = "https://github.com/chenbh17/cbhcli/issues"
"Source" = "https://github.com/chenbh17/cbhcli/"

[tool.setuptools.packages.find]
include = ["cbhcli_pkg*"]

[tool.setuptools.package-data]
"cbhcli_pkg.web" = ["static/**/*"]